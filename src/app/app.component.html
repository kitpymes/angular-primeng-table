<div class="card">
  <p-table
  #dt1
        [value]="customers"
        [lazy]="true"
        (onLazyLoad)="loadData($event)"
        dataKey="id"
        [tableStyle]="{ 'min-width': '75rem', 'height': '500px' }"
        [paginator]="true"
        [rowsPerPageOptions]="[5, 10, 20, 30, 50, 100]"
        [showCurrentPageReport]="true"
        [first]="10"
        [rows]="10"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords}"
        [totalRecords]="totalRecords"
        [loading]="loading"
        [globalFilterFields]="['name', 'country.name', 'company', 'representative.name']"
      >
      <ng-template pTemplate="caption">
        <div class="flex">
          <span class="p-input-icon-left ml-auto">
            <i class="pi pi-search"></i>
            <input
              pInputText
              type="text"
              (input)="dt1.filterGlobal($any($event.target).value, 'contains')"
              placeholder="Search keyword"
            />
          </span>
        </div>
      </ng-template>
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id">
            Id <p-sortIcon field="id"></p-sortIcon>
          </th>
          <th pSortableColumn="name">
            Name <p-sortIcon field="name"></p-sortIcon>
          </th>
          <th pSortableColumn="country.name">
            Country <p-sortIcon field="country.name"></p-sortIcon>
          </th>
          <th pSortableColumn="company">
            Company <p-sortIcon field="company"></p-sortIcon>
          </th>
          <th pSortableColumn="representative.name">
            Representative <p-sortIcon field="representative.name"></p-sortIcon>
          </th>
        </tr>
        <tr>
          <th>
            <p-columnFilter type="text" field="id"></p-columnFilter>
          </th>
          <th>
            <p-columnFilter type="text" field="name"></p-columnFilter>
          </th>
          <th>
            <p-columnFilter type="text" field="country.name"></p-columnFilter>
          </th>
          <th>
            <p-columnFilter type="text" field="company"></p-columnFilter>
          </th>
          <th>
            <p-columnFilter type="text" field="representative.name"></p-columnFilter>
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-customer>
        <tr>
          <td>{{ customer.id }}</td>
          <td>{{ customer.name }}</td>
          <td>{{ customer.country.name }}</td>
          <td>{{ customer.company }}</td>
          <td>{{ customer.representative.name }}</td>
        </tr>
      </ng-template>
    </p-table>
</div>
